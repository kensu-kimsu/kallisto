name: Refresh Adaptive Experiment Dashboard

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/refresh-adaptive-dashboard.yml"
      - "tools/refresh_adaptive_dashboard.py"
  schedule:
    # GitHub scheduled workflows can be delayed. Retry several times after
    # the NYSE close so one delayed run does not leave the repo stale.
    - cron: "15,45 21-23 * * 1-5"
    - cron: "15,45 0-1 * * 2-6"

permissions:
  contents: write
  id-token: write

concurrency:
  group: kallisto-dashboard-refresh
  cancel-in-progress: false

jobs:
  refresh-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync checkout to latest main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install refresh dependencies
        run: |
          python -m pip install --upgrade pip
          pip install azure-storage-blob pandas-market-calendars

      - name: Login to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_501BA23DB0FE456AAE990757AE5479AB }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_ACAC2866925A426FA1F81AE07594385E }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_6E926333B8764652870065B657F6CFC8 }}

      - name: Read Function storage connection securely
        shell: bash
        run: |
          set -euo pipefail
          APP_NAME="${{ vars.AZURE_FUNCTIONAPP_NAME }}"
          if [ -z "$APP_NAME" ]; then
            echo "AZURE_FUNCTIONAPP_NAME repository variable is missing." >&2
            exit 1
          fi

          CONN=$(az functionapp config appsettings list \
            --name "$APP_NAME" \
            --resource-group "rg-llm-scalper-v1" \
            --query "[?name=='AzureWebJobsStorage'].value | [0]" -o tsv)

          if [ -z "$CONN" ] || [ "$CONN" = "null" ]; then
            echo "AzureWebJobsStorage was not found on the Function App." >&2
            exit 1
          fi

          echo "::add-mask::$CONN"
          echo "AZURE_STORAGE_CONNECTION_STRING=$CONN" >> "$GITHUB_ENV"

          APP_STATE=$(az functionapp show \
            --name "$APP_NAME" \
            --resource-group "rg-llm-scalper-v1" \
            --query state -o tsv)
          echo "FUNCTION_APP_STATE=${APP_STATE:-UNKNOWN}" >> "$GITHUB_ENV"

      - name: Refresh repository snapshot from Azure Blob
        env:
          SCALPING_STATE_CONTAINER: scalping-v1-state
        run: |
          set -euo pipefail
          python tools/refresh_adaptive_dashboard.py

      - name: Verify downloaded state is current enough
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          import json
          import os
          from datetime import datetime, timedelta, time
          from pathlib import Path
          from zoneinfo import ZoneInfo

          import pandas_market_calendars as mcal

          root = Path("user_side/runs/scalping_v1")
          daily_path = root / "daily_performance.csv"
          state_path = root / "portfolio_state.json"

          if not daily_path.exists():
              raise SystemExit("daily_performance.csv was not downloaded from Azure Blob Storage.")
          if not state_path.exists():
              raise SystemExit("portfolio_state.json was not downloaded from Azure Blob Storage.")

          with daily_path.open(newline="", encoding="utf-8") as f:
              rows = list(csv.DictReader(f))
          latest_daily = rows[-1]["date"] if rows else None

          state = json.loads(state_path.read_text(encoding="utf-8"))
          state_session = state.get("session_date")

          now_et = datetime.now(ZoneInfo("America/New_York"))
          cal = mcal.get_calendar("NYSE")
          sched = cal.schedule(
              start_date=now_et.date() - timedelta(days=10),
              end_date=now_et.date(),
          )

          expected = None
          if not sched.empty:
              sessions = [d.date() for d in sched.index]
              # Before 16:20 ET, the current session is not yet expected to have
              # its final daily row. After that, today is expected if it is a session.
              if now_et.date() in sessions and now_et.time() < time(16, 20):
                  sessions = [d for d in sessions if d < now_et.date()]
              if sessions:
                  expected = sessions[-1].isoformat()

          status = "FRESH"
          detail = ""
          if expected and latest_daily != expected:
              if state_session == expected:
                  status = "STALE_DAILY_SUMMARY"
                  detail = (
                      f"Azure portfolio state reached {expected}, but "
                      f"daily_performance.csv ends at {latest_daily}."
                  )
              else:
                  status = "STALE_AZURE_STATE"
                  detail = (
                      f"Expected completed NYSE session {expected}, but Azure "
                      f"portfolio state is {state_session} and daily results end at {latest_daily}."
                  )

          diag = {
              "checked_at_et": now_et.isoformat(),
              "function_app_state": os.environ.get("FUNCTION_APP_STATE", "UNKNOWN"),
              "expected_latest_completed_nyse_session": expected,
              "azure_portfolio_session_date": state_session,
              "azure_last_cycle_et": state.get("last_cycle_et"),
              "azure_last_decision_et": state.get("last_decision_et"),
              "daily_performance_latest_date": latest_daily,
              "status": status,
              "detail": detail,
          }

          out = Path("docs/results/dashboard_refresh_status.json")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(diag, indent=2, sort_keys=True) + "\n", encoding="utf-8")

          print(json.dumps(diag, indent=2, sort_keys=True))

          # Do not block the commit. We want the diagnostic file pushed even if
          # Azure itself is stale; the final step will surface the failure.
          PY

      - name: Commit refreshed experiment dashboard
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md docs/results user_side/runs/scalping_v1

          if git diff --cached --quiet; then
            echo "No dashboard changes to commit."
          else
            git commit -m "docs: refresh adaptive experiment dashboard"
            git push origin HEAD:main
          fi

      - name: Report stale Azure source after preserving diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path("docs/results/dashboard_refresh_status.json").read_text(encoding="utf-8")
          )
          if data.get("status") != "FRESH":
              raise SystemExit(f"{data.get('status')}: {data.get('detail')}")
          print("Kallisto GitHub snapshot is current.")
          PY
