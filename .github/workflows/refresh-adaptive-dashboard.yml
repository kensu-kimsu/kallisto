name: Refresh Adaptive Experiment Dashboard

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/refresh-adaptive-dashboard.yml"
      - "tools/refresh_adaptive_dashboard.py"
  schedule:
    # Primary post-market refresh plus a retry in case GitHub or Azure is delayed.
    - cron: "30 22 * * 1-5"
    - cron: "0 23 * * 1-5"

permissions:
  contents: write
  id-token: write

concurrency:
  group: kallisto-dashboard-refresh
  cancel-in-progress: false

jobs:
  refresh-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dashboard dependencies
        run: pip install azure-storage-blob pandas-market-calendars

      - name: Login to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_501BA23DB0FE456AAE990757AE5479AB }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_ACAC2866925A426FA1F81AE07594385E }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_6E926333B8764652870065B657F6CFC8 }}

      - name: Read Function storage connection securely
        shell: bash
        run: |
          CONN=$(az functionapp config appsettings list \
            --name "${{ vars.AZURE_FUNCTIONAPP_NAME }}" \
            --resource-group "rg-llm-scalper-v1" \
            --query "[?name=='AzureWebJobsStorage'].value | [0]" -o tsv)
          if [ -z "$CONN" ]; then
            echo "AzureWebJobsStorage was not found." >&2
            exit 1
          fi
          echo "::add-mask::$CONN"
          echo "AZURE_STORAGE_CONNECTION_STRING=$CONN" >> "$GITHUB_ENV"

      - name: Capture Azure Function App state
        shell: bash
        run: |
          APP_STATE=$(az functionapp show \
            --name "${{ vars.AZURE_FUNCTIONAPP_NAME }}" \
            --resource-group "rg-llm-scalper-v1" \
            --query state -o tsv 2>/dev/null || true)
          echo "FUNCTION_APP_STATE=${APP_STATE:-UNKNOWN}" >> "$GITHUB_ENV"

      - name: Refresh README and charts from Azure
        env:
          SCALPING_STATE_CONTAINER: scalping-v1-state
        run: python tools/refresh_adaptive_dashboard.py

      - name: Record Azure freshness diagnostics
        shell: bash
        run: |
          python - <<'PY'
          import csv
          import json
          from datetime import datetime, timedelta
          from pathlib import Path
          from zoneinfo import ZoneInfo

          import pandas_market_calendars as mcal

          run_root = Path("user_side/runs/scalping_v1")
          daily_path = run_root / "daily_performance.csv"
          portfolio_path = run_root / "portfolio_state.json"

          with daily_path.open(newline="", encoding="utf-8") as f:
              rows = list(csv.DictReader(f))
          latest_daily = rows[-1]["date"] if rows else None

          portfolio = {}
          if portfolio_path.exists():
              portfolio = json.loads(portfolio_path.read_text(encoding="utf-8"))
          state_session = portfolio.get("session_date")

          now_et = datetime.now(ZoneInfo("America/New_York"))
          cal = mcal.get_calendar("NYSE")
          schedule = cal.schedule(
              start_date=(now_et.date() - timedelta(days=10)),
              end_date=now_et.date(),
          )
          expected = schedule.index[-1].date().isoformat() if not schedule.empty else None

          # At the scheduled post-market refresh times the current NYSE session
          # should already be finalized. For manual runs before 16:20 ET, do not
          # demand today's row yet.
          if now_et.time().hour < 16 or (now_et.time().hour == 16 and now_et.time().minute < 20):
              if len(schedule.index) >= 2:
                  expected = schedule.index[-2].date().isoformat()

          status = "FRESH"
          detail = ""
          if expected and latest_daily != expected:
              if state_session == expected:
                  status = "STALE_DAILY_SUMMARY"
                  detail = f"Azure state reached {expected}, but daily_performance.csv ends at {latest_daily}."
              else:
                  status = "STALE_AZURE_STATE"
                  detail = f"Expected {expected}, but portfolio state is {state_session} and daily results end at {latest_daily}."

          diagnostics = {
              "checked_at_et": now_et.isoformat(),
              "function_app_state": __import__("os").environ.get("FUNCTION_APP_STATE", "UNKNOWN"),
              "expected_latest_completed_nyse_session": expected,
              "azure_portfolio_session_date": state_session,
              "azure_last_cycle_et": portfolio.get("last_cycle_et"),
              "azure_last_decision_et": portfolio.get("last_decision_et"),
              "daily_performance_latest_date": latest_daily,
              "status": status,
              "detail": detail,
          }
          out = Path("docs/results/dashboard_refresh_status.json")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(diagnostics, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps(diagnostics, indent=2, sort_keys=True))
          PY

      - name: Commit refreshed experiment dashboard
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No dashboard changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/results user_side/runs/scalping_v1
          git commit -m "docs: refresh adaptive experiment dashboard"
          git push

      - name: Fail visibly when Azure state is stale
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("docs/results/dashboard_refresh_status.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          if data.get("status") != "FRESH":
              raise SystemExit(f"{data.get('status')}: {data.get('detail')}")
          print("Dashboard source state is fresh.")
          PY
