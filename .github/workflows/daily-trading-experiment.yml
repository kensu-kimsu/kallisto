name: Legacy GitHub Scalping Runner (manual only)

on:
  workflow_dispatch:
    inputs:
      segment:
        description: "Legacy test mode"
        required: true
        default: "single"
        type: choice
        options:
          - single
          - morning
          - afternoon

permissions:
  contents: write

concurrency:
  group: final-v1-scalping-legacy
  cancel-in-progress: false

jobs:
  legacy-test:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Run smoke tests
        run: python -m unittest discover -s tests -p "test_scalping_smoke.py" -v
      - name: Run legacy manual cycle/segment
        run: |
          if [ "${{ inputs.segment }}" = "single" ]; then
            python -m user_side.personal_experiment.scalping_v1
          else
            python -m user_side.personal_experiment.scalping_session_runner --segment "${{ inputs.segment }}"
          fi

# IMPORTANT: scheduled NYSE-session automation has moved to Azure Functions.
# This workflow intentionally has no cron schedule so GitHub Actions cannot
# accidentally create a second trading clock or duplicate simulated trades.
