name: Final V1 LLM Scalping Experiment

on:
  workflow_dispatch:

  schedule:
    # GitHub cron uses UTC. These schedules cover both U.S. daylight-saving
    # and standard-time market hours. The Python workflow checks New York
    # time and exits before OpenAI when the NYSE is closed/outside the window.
    # Main decision/monitor cycles: approximately every 30 minutes.
    - cron: "35 13-20 * * 1-5"
    - cron: "5 14-21 * * 1-5"
    # Extra end-of-day cycle catches 15:55 ET in either DST regime.
    - cron: "55 19,20 * * 1-5"

permissions:
  contents: write

concurrency:
  group: final-v1-scalping
  cancel-in-progress: false

jobs:
  run-scalping-simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Verify API key exists
        run: |
          python -c "import os; print('OPENAI_API_KEY is set' if os.environ.get('OPENAI_API_KEY') else 'OPENAI_API_KEY is NOT set')"

      - name: Validate final V1 Python
        run: |
          python -m py_compile user_side/personal_experiment/scalping_state.py
          python -m py_compile user_side/personal_experiment/scalping_market_data.py
          python -m py_compile user_side/personal_experiment/scalping_strategy.py
          python -m py_compile user_side/personal_experiment/scalping_engine.py
          python -m py_compile user_side/personal_experiment/scalping_reporting.py
          python -m py_compile user_side/personal_experiment/scalping_v1.py

      - name: Run scalping simulation cycle
        run: |
          python -m user_side.personal_experiment.scalping_v1

      - name: Persist simulation state to GitHub
        run: |
          git add -- user_side/runs/scalping_v1 docs/journal/daily docs/results
          if git diff --cached --quiet; then
            echo "No simulation-state changes to commit."
          else
            git commit -m "experiment: update final V1 scalping state"
            git push origin main
          fi
