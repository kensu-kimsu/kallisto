name: Final V1 Scalping Smoke Test

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - "function_app.py"
      - "host.json"
      - "requirements.txt"
      - "user_side/personal_experiment/scalping_*.py"
      - "user_side/personal_experiment/adaptive_learning.py"
      - "user_side/personal_experiment/baseline_replay.py"
      - "user_side/personal_experiment/azure_runtime.py"
      - "user_side/personal_experiment/broker/**"
      - "tests/test_scalping_smoke.py"
      - "tests/test_adaptive_learning.py"
      - "tests/test_v12_controls.py"
      - "tests/test_moomoo_broker_safety.py"
      - "tests/test_moomoo_rest_paper.py"
      - ".github/workflows/scalping-smoke-test.yml"

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Compile Final V1 + Azure + adaptive + broker modules
        run: |
          python -m py_compile function_app.py
          python -m py_compile user_side/personal_experiment/azure_runtime.py
          python -m py_compile user_side/personal_experiment/adaptive_learning.py
          python -m py_compile user_side/personal_experiment/baseline_replay.py
          python -m py_compile user_side/personal_experiment/scalping_state.py
          python -m py_compile user_side/personal_experiment/scalping_market_data.py
          python -m py_compile user_side/personal_experiment/scalping_api_costs.py
          python -m py_compile user_side/personal_experiment/scalping_strategy.py
          python -m py_compile user_side/personal_experiment/scalping_engine.py
          python -m py_compile user_side/personal_experiment/scalping_net_risk.py
          python -m py_compile user_side/personal_experiment/scalping_reporting.py
          python -m py_compile user_side/personal_experiment/scalping_v1.py
          python -m py_compile user_side/personal_experiment/scalping_session_runner.py
          python -m py_compile user_side/personal_experiment/broker/safety.py
          python -m py_compile user_side/personal_experiment/broker/moomoo_paper.py
          python -m py_compile user_side/personal_experiment/broker/moomoo_rest.py
          python -m py_compile user_side/personal_experiment/broker/moomoo_rest_paper.py
          python -m py_compile user_side/personal_experiment/broker/moomoo_shadow.py
      - name: Run deterministic smoke tests
        run: |
          python -m unittest discover -s tests -p "test_scalping_smoke.py" -v
          python -m unittest discover -s tests -p "test_adaptive_learning.py" -v
          python -m unittest discover -s tests -p "test_v12_controls.py" -v
          python -m unittest discover -s tests -p "test_moomoo_broker_safety.py" -v
          python -m unittest discover -s tests -p "test_moomoo_rest_paper.py" -v
