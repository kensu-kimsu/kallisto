<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="600" viewBox="0 0 2400 600" role="img" aria-labelledby="title desc">
  <title id="title">Kallisto AI-driven scalping research platform</title>
  <desc id="desc">Institutional fintech banner with Kallisto branding, market charts and quantitative trading motifs.</desc>
  <defs>
